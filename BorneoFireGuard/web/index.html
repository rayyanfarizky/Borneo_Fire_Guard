<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Borneo Fire Guard
</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* ====== GANTI LATAR DI SINI ======
       Ganti nilai --bg-image dengan gambar dari Figma kamu, contoh:
       --bg-image: url("latar.png");
       atau pakai tombol "Ganti latar" di pojok kanan atas. */
    --bg-image:
      radial-gradient(1200px 500px at 15% -10%, rgba(120,160,90,.35), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(70,120,130,.30), transparent 60%),
      linear-gradient(180deg, #2b2a1f 0%, #221e16 45%, #171310 100%);

    --overlay: rgba(14, 12, 9, .35);
    --panel: rgba(24, 21, 16, .62);
    --panel-line: rgba(255, 244, 220, .14);
    --text: #f3ecdc;
    --muted: #b8ae98;
    --moss: #9cc46b;
    --water: #5cc6c9;
    --heat: #f0b44c;
    --smoke: #b7a9d8;
    --bad: #f07a6a;
    --radius: 22px;
    --font-head: "Bricolage Grotesque", "Trebuchet MS", sans-serif;
    --font-body: "Instrument Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html { height: 100%; }
  body {
    margin: 0; min-height: 100%;
    font-family: var(--font-body); color: var(--text);
    background-color: #171310;
    background-image: linear-gradient(var(--overlay), var(--overlay)), var(--bg-image);
    background-size: cover; background-position: center; background-attachment: fixed;
    padding: max(20px, env(safe-area-inset-top, 0px)) 20px max(28px, env(safe-area-inset-bottom, 0px));
  }
  .wrap { max-width: 1080px; margin: 0 auto; }

  header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
  h1 { font-family: var(--font-head); font-weight: 700; font-size: clamp(30px, 5vw, 46px); line-height: 1.05; margin: 0 0 8px; letter-spacing: -.02em; }
  .sub { margin: 0; color: var(--muted); max-width: 46ch; line-height: 1.5; }
  .tools { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .conn { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--panel-line); font-size: 14px; backdrop-filter: blur(10px); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
  .conn.on .dot { background: var(--moss); box-shadow: 0 0 0 4px rgba(156,196,107,.2); }
  .conn.off .dot { background: var(--bad); }
  .conn.demo .dot { background: var(--heat); }
  button, .btn {
    font: inherit; color: var(--text); cursor: pointer;
    padding: 8px 14px; border-radius: 999px; background: var(--panel); border: 1px solid var(--panel-line); backdrop-filter: blur(10px);
  }
  button:hover, .btn:hover { border-color: rgba(255,244,220,.35); }
  :focus-visible { outline: 2px solid var(--moss); outline-offset: 3px; }

  .grid { display: grid; grid-template-columns: 1.05fr 1fr; gap: 18px; }
  .stack { display: grid; gap: 18px; }
  .card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: var(--radius); padding: 22px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .card h2 { font-family: var(--font-head); font-size: 19px; margin: 0; font-weight: 500; }
  .card-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 14px; }
  .pill { font-size: 13px; padding: 4px 11px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .num { font-family: var(--font-head); font-weight: 700; letter-spacing: -.03em; line-height: 1; }
  .num small { font-size: .4em; font-weight: 500; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
  .hint { color: var(--muted); font-size: 14px; margin: 10px 0 0; line-height: 1.45; }

  /* Kelembapan: tabung tanah */
  .soil { display: flex; gap: 26px; align-items: center; }
  .tube-wrap { flex: none; }
  .tube { width: 96px; height: 250px; border-radius: 48px 48px 20px 20px; border: 2px solid rgba(255,244,220,.28); background: rgba(0,0,0,.28); position: relative; overflow: hidden; }
  .tube .earth { position: absolute; left: 0; right: 0; bottom: 0; height: 100%; background: linear-gradient(180deg, #5a4630, #3a2c1d); }
  .tube .wet { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(180deg, rgba(92,198,201,.75), rgba(46,120,130,.9)); transition: height 1s ease, background .4s; }
  .tube .wet::before { content: ""; position: absolute; left: 0; right: 0; top: -1px; height: 3px; background: rgba(255,255,255,.55); }
  .tube .tick { position: absolute; right: 0; width: 14px; height: 1px; background: rgba(255,244,220,.5); }
  .soil-read .num { font-size: clamp(64px, 11vw, 96px); color: var(--water); }

  /* Suhu */
  .temp-read .num { font-size: 56px; color: var(--heat); }
  .scale { position: relative; height: 10px; border-radius: 6px; margin-top: 18px; background: linear-gradient(90deg, #5cc6c9 0%, #9cc46b 40%, #f0b44c 65%, #f07a6a 100%); }
  .marker { position: absolute; top: -5px; width: 4px; height: 20px; border-radius: 2px; background: #fff; box-shadow: 0 0 0 3px rgba(0,0,0,.35); left: 0; transition: left .8s ease; }
  .scale-labels { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* Gas */
  .gauge { position: relative; width: 100%; max-width: 260px; margin: 0 auto; }
  .gauge svg { display: block; width: 100%; }
  .gauge .track { fill: none; stroke: rgba(255,244,220,.14); stroke-width: 16; stroke-linecap: round; }
  .gauge .fill { fill: none; stroke: var(--smoke); stroke-width: 16; stroke-linecap: round; transition: stroke-dasharray .8s ease, stroke .4s; }
  .gauge .center { position: absolute; left: 0; right: 0; bottom: 4px; text-align: center; }
  .gauge .num { font-size: 42px; color: var(--smoke); }

  .spark { width: 100%; height: 34px; margin-top: 14px; display: block; }
  .spark polyline { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; opacity: .9; }

  .alert { display: none; margin-bottom: 18px; padding: 14px 18px; border-radius: 16px; background: rgba(240,122,106,.16); border: 1px solid var(--bad); color: #ffd9d3; }
  .alert.show { display: block; }

  footer { margin-top: 22px; color: var(--muted); font-size: 13px; display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  @media (max-width: 820px) {
    .grid { grid-template-columns: 1fr; }
  }
  @media (max-width: 420px) {
    .soil { flex-direction: column; align-items: flex-start; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Borneo Fire Guard</h1>
      <p class="sub">Kelembapan tanah, suhu, dan kadar asap atau gas dari sensor kamu, diperbarui langsung dari Firebase.</p>
    </div>
    <div class="tools">
      <span id="conn" class="conn"><span class="dot"></span><span id="connText">Menghubungkan…</span></span>
      <label class="btn" for="bgFile" tabindex="0">Ganti latar</label>
      <input id="bgFile" type="file" accept="image/*" hidden>
    </div>
  </header>

  <div id="alert" class="alert" role="alert"></div>

  <main class="grid">
    <section class="card" aria-labelledby="t-soil">
      <div class="card-top">
        <h2 id="t-soil">Kelembapan tanah</h2>
        <span id="soilPill" class="pill" style="color:var(--muted)">–</span>
      </div>
      <div class="soil">
        <div class="tube-wrap">
          <div class="tube" aria-hidden="true">
            <div class="earth"></div>
            <div class="wet" id="wet"></div>
            <div class="tick" style="bottom:25%"></div>
            <div class="tick" style="bottom:50%"></div>
            <div class="tick" style="bottom:75%"></div>
          </div>
        </div>
        <div class="soil-read">
          <div class="num"><span id="soilVal">--</span><small>%</small></div>
          <p class="hint" id="soilHint">Menunggu data dari sensor.</p>
          <svg class="spark" id="sparkSoil" viewBox="0 0 120 32" preserveAspectRatio="none"><polyline stroke="var(--water)" points=""/></svg>
        </div>
      </div>
    </section>

    <div class="stack">
      <section class="card" aria-labelledby="t-temp">
        <div class="card-top">
          <h2 id="t-temp">Suhu</h2>
          <span id="tempPill" class="pill" style="color:var(--muted)">–</span>
        </div>
        <div class="temp-read">
          <div class="num"><span id="tempVal">--</span><small>°C</small></div>
          <div class="scale" aria-hidden="true"><div class="marker" id="tempMark"></div></div>
          <div class="scale-labels"><span>0°</span><span>25°</span><span>50°</span></div>
          <svg class="spark" id="sparkTemp" viewBox="0 0 120 32" preserveAspectRatio="none"><polyline stroke="var(--heat)" points=""/></svg>
        </div>
      </section>

      <section class="card" aria-labelledby="t-gas">
        <div class="card-top">
          <h2 id="t-gas">Asap dan gas</h2>
          <span id="gasPill" class="pill" style="color:var(--muted)">–</span>
        </div>
        <div class="gauge">
          <svg viewBox="0 0 200 116" aria-hidden="true">
            <path class="track" d="M 14 104 A 86 86 0 0 1 186 104" pathLength="100"/>
            <path class="fill" id="gasArc" d="M 14 104 A 86 86 0 0 1 186 104" pathLength="100" stroke-dasharray="0 100"/>
          </svg>
          <div class="center"><div class="num"><span id="gasVal">--</span><small>ppm</small></div></div>
        </div>
        <svg class="spark" id="sparkGas" viewBox="0 0 120 32" preserveAspectRatio="none"><polyline stroke="var(--smoke)" points=""/></svg>
      </section>
    </div>
  </main>

  <footer>
    <span id="updated">Belum ada data</span>
    <span id="modeNote"></span>
  </footer>
</div>

<!-- Firebase (compat) lewat jsDelivr -->
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@10.12.2/firebase-database-compat.js"></script>
<script>
/* =====================================================
   1. ISI KONFIGURASI FIREBASE KAMU
   Firebase Console > Project settings > Your apps > Web app
   ===================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyATAd7KiXzKGqUGVIIEZsEbaWdMgBeCyW8",
  authDomain: "borneo-fire-guard.firebaseapp.com",
  databaseURL: "https://borneo-fire-guard-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "borneo-fire-guard",
  storageBucket: "borneo-fire-guard.firebasestorage.app",
  messagingSenderId: "1014136925467",
  appId: "1:1014136925467:web:bc948dbf9ee1fa82d677be"
};

/* Lokasi data di Realtime Database dan nama field-nya */
const DB_PATH = "sensor";
const FIELD = { soil: "kelembapan", temp: "suhu", gas: "gas" };

/* Batas status (sesuaikan dengan sensor kamu) */
const LIMIT = {
  soilDry: 30, soilWet: 70,     // %
  tempCool: 20, tempHot: 32,    // °C
  gasWarn: 300, gasDanger: 700  // ppm
};

/* ===================================================== */
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const hist = { soil: [], temp: [], gas: [] };
const MAX_POINTS = 30;

function setConn(state, text) {
  $("conn").className = "conn " + state;
  $("connText").textContent = text;
}

function pill(el, text, color) {
  el.textContent = text; el.style.color = color;
}

function spark(id, arr) {
  if (arr.length < 2) return;
  const min = Math.min(...arr), max = Math.max(...arr), span = max - min || 1;
  const pts = arr.map((v, i) => {
    const x = (i / (MAX_POINTS - 1)) * 120 + (MAX_POINTS - arr.length) * (120 / (MAX_POINTS - 1));
    const y = 28 - ((v - min) / span) * 24;
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  $(id).querySelector("polyline").setAttribute("points", pts);
}

function push(key, v) {
  hist[key].push(v);
  if (hist[key].length > MAX_POINTS) hist[key].shift();
}

function render(d) {
  const soil = Number(d[FIELD.soil]);
  const temp = Number(d[FIELD.temp]);
  const gas  = Number(d[FIELD.gas]);
  const warnings = [];

  if (!isNaN(soil)) {
    push("soil", soil);
    $("soilVal").textContent = soil.toFixed(0);
    $("wet").style.height = clamp(soil, 0, 100) + "%";
    if (soil < LIMIT.soilDry) {
      pill($("soilPill"), "Kering", "var(--heat)");
      $("soilHint").textContent = "Tanah terlalu kering. Saatnya menyiram.";
      warnings.push("Tanah kering, kelembapan " + soil.toFixed(0) + "%.");
    } else if (soil > LIMIT.soilWet) {
      pill($("soilPill"), "Basah", "var(--water)");
      $("soilHint").textContent = "Tanah cukup basah. Tunda penyiraman.";
    } else {
      pill($("soilPill"), "Ideal", "var(--moss)");
      $("soilHint").textContent = "Kelembapan tanah dalam kisaran ideal.";
    }
    spark("sparkSoil", hist.soil);
  }

  if (!isNaN(temp)) {
    push("temp", temp);
    $("tempVal").textContent = temp.toFixed(1);
    $("tempMark").style.left = "calc(" + clamp(temp / 50, 0, 1) * 100 + "% - 2px)";
    if (temp < LIMIT.tempCool) pill($("tempPill"), "Sejuk", "var(--water)");
    else if (temp > LIMIT.tempHot) { pill($("tempPill"), "Panas", "var(--bad)"); warnings.push("Suhu tinggi, " + temp.toFixed(1) + "°C."); }
    else pill($("tempPill"), "Normal", "var(--moss)");
    spark("sparkTemp", hist.temp);
  }

  if (!isNaN(gas)) {
    push("gas", gas);
    $("gasVal").textContent = gas.toFixed(0);
    const pct = clamp(gas / 1000, 0, 1) * 100;
    const arc = $("gasArc");
    let color = "var(--smoke)";
    if (gas >= LIMIT.gasDanger) { pill($("gasPill"), "Bahaya", "var(--bad)"); color = "var(--bad)"; warnings.push("Asap atau gas terdeteksi tinggi: " + gas.toFixed(0) + " ppm."); }
    else if (gas >= LIMIT.gasWarn) { pill($("gasPill"), "Waspada", "var(--heat)"); color = "var(--heat)"; }
    else pill($("gasPill"), "Aman", "var(--moss)");
    arc.style.stroke = color;
    arc.setAttribute("stroke-dasharray", pct + " 100");
    spark("sparkGas", hist.gas);
  }

  const al = $("alert");
  if (warnings.length) { al.textContent = warnings.join(" "); al.classList.add("show"); }
  else al.classList.remove("show");

  $("updated").textContent = "Diperbarui " + new Date().toLocaleTimeString("id-ID");
}

/* ---------- Koneksi Firebase atau mode demo ---------- */
const configured = !FIREBASE_CONFIG.apiKey.startsWith("ISI_");

if (configured && window.firebase) {
  try {
    firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.database();
    db.ref(".info/connected").on("value", (s) => {
      s.val() ? setConn("on", "Terhubung ke Firebase") : setConn("off", "Terputus");
    });
    db.ref(DB_PATH).on("value", (snap) => {
      const v = snap.val();
      if (v) render(v);
    }, (err) => {
      setConn("off", "Gagal membaca data");
      $("modeNote").textContent = "Periksa aturan (rules) database: " + err.message;
    });
    $("modeNote").textContent = "Membaca /" + DB_PATH;
  } catch (e) {
    setConn("off", "Konfigurasi Firebase salah");
    $("modeNote").textContent = e.message;
  }
} else {
  // Mode demo: data acak supaya tampilan bisa dicoba tanpa Firebase
  setConn("demo", "Mode demo");
  $("modeNote").textContent = "Isi FIREBASE_CONFIG di index.html untuk memakai data asli";
  let s = 52, t = 28, g = 180;
  const tick = () => {
    s = clamp(s + (Math.random() - .5) * 6, 5, 95);
    t = clamp(t + (Math.random() - .5) * 1.2, 18, 40);
    g = clamp(g + (Math.random() - .45) * 90, 60, 900);
    render({ [FIELD.soil]: s, [FIELD.temp]: t, [FIELD.gas]: g });
  };
  for (let i = 0; i < 12; i++) tick();
  setInterval(tick, 2500);
}

/* ---------- Ganti latar ---------- */
function applyBg(url) {
  document.documentElement.style.setProperty("--bg-image", 'url("' + url + '")');
}
try {
  const saved = localStorage.getItem("bg-image");
  if (saved) applyBg(saved);
} catch (e) {}
$("bgFile").addEventListener("change", (e) => {
  const f = e.target.files[0];
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    applyBg(r.result);
    try { localStorage.setItem("bg-image", r.result); } catch (err) {}
  };
  r.readAsDataURL(f);
});
document.querySelector('label[for="bgFile"]').addEventListener("keydown", (e) => {
  if (e.key === "Enter" || e.key === " ") { e.preventDefault(); $("bgFile").click(); }
});
</script>
</body>
</html>
